<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        .error-container {
            text-align: center;
            padding: 40px;
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: #ff4800;
            letter-spacing: 5px;
        }

        .error-title {
            font-size: 25px;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 14px;
            color: #888894;
            line-height: 1.6;
        }

        .error-line {
            width: 50px;
            height: 4px;
            background: #ff4800;
            margin: 25px auto;
            border-radius: 10px;
        }

        .error-footer {
            font-size: 11px;
            color: #555560;
            margin-top: 35px;
            letter-spacing: 2px;
        }
    </style>
</head>

</html>
